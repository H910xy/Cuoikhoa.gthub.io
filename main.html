<!DOCTYPE html>
<html lang="en" data-browse-ds="aperture">

<head>
    <meta charset="UTF-8">
    <title>File Dropzone</title>
    <meta name="description" content="A multi-file upload dropzone with drag-and-drop, file previews, and progress simulation — fully token-driven.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-layer"></div>

    <main class="dz-container">
        <div class="dz-card">
            <header class="dz-header">
                <div class="dz-header__icon">
                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M12 11v6"/><path d="M9.5 13.5l2.5 -2.5l2.5 2.5"/></svg>
                </div>
                <div class="dz-header__text">
                    <h1 class="dz-header__title">Upload files</h1>
                    <p class="dz-header__subtitle">Select or drag files to upload</p>
                </div>
                <div class="dz-header__actions">
                    <button type="button" class="dz-header-btn" id="info-btn" aria-label="Upload info" aria-expanded="false" aria-controls="info-panel">
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></svg>
                    </button>
                    <div class="dz-popover" id="info-panel" role="dialog" aria-label="Upload requirements" aria-hidden="true" inert>
                        <div class="dz-popover__row">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/></svg>
                            <span>Max file size</span>
                            <span class="dz-popover__badge">25 MB</span>
                        </div>
                        <div class="dz-popover__row">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-8 4l8 4l8 -4l-8 -4"/><path d="M4 12l8 4l8 -4"/><path d="M4 16l8 4l8 -4"/></svg>
                            <span>Max files</span>
                            <span class="dz-popover__badge">10</span>
                        </div>
                        <div class="dz-popover__row dz-popover__row--wrap">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8h.01"/><path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12z"/><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5"/><path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"/></svg>
                            <span>Accepted</span>
                            <span class="dz-popover__chips">
                                <span class="dz-popover__chip">JPEG</span>
                                <span class="dz-popover__chip">PNG</span>
                            </span>
                        </div>
                    </div>
                    <button type="button" class="dz-header-btn" id="settings-btn" aria-label="Upload settings" aria-expanded="false" aria-controls="settings-panel">
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.066 2.573c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.573 1.066c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.066 -2.573c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg>
                    </button>
                    <div class="dz-settings" id="settings-panel" role="dialog" aria-label="Upload settings" aria-hidden="true" inert>
                        <div class="dz-settings__row">
                            <label class="dz-settings__label" for="toggle-auto">Auto-upload on drop</label>
                            <button type="button" class="dz-toggle" id="toggle-auto" role="switch" aria-checked="false" aria-label="Auto-upload on drop">
                                <span class="dz-toggle__track" aria-hidden="true"><span class="dz-toggle__thumb"></span></span>
                            </button>
                        </div>
                        <div class="dz-settings__row">
                            <label class="dz-settings__label" for="toggle-thumbs">Show thumbnails</label>
                            <button type="button" class="dz-toggle" id="toggle-thumbs" role="switch" aria-checked="true" aria-label="Show thumbnails">
                                <span class="dz-toggle__track" aria-hidden="true"><span class="dz-toggle__thumb"></span></span>
                            </button>
                        </div>
                        <div class="dz-settings__row">
                            <label class="dz-settings__label" for="toggle-notify">Notifications</label>
                            <button type="button" class="dz-toggle" id="toggle-notify" role="switch" aria-checked="true" aria-label="Notifications">
                                <span class="dz-toggle__track" aria-hidden="true"><span class="dz-toggle__thumb"></span></span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <label class="dz-dropzone" id="dropzone" for="file-input" role="button" aria-labelledby="dropzone-label" aria-describedby="dropzone-hint" tabindex="0">
                <div class="dz-dropzone__icon" id="dropzone-icon">
                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.6 4.4 0 0 1 0 -9a5 4.5 0 0 1 11 2h1a3.5 3.5 0 0 1 0 7h-1"/><path d="M9 15l3 -3l3 3"/><path d="M12 12l0 9"/></svg>
                </div>
                <p class="dz-dropzone__label" id="dropzone-label">Drop files here or click to browse</p>
                <p class="dz-dropzone__hint" id="dropzone-hint">JPEG, PNG up to 25&nbsp;MB each</p>
                <input type="file" id="file-input" name="upload-files" multiple accept="image/jpeg,image/png" aria-label="Choose files to upload" tabindex="-1">
            </label>

            <p class="dz-feedback" id="dz-feedback" aria-live="polite"></p>

            <div class="dz-file-list" id="file-list" role="list" aria-label="Selected files" aria-live="polite" aria-atomic="false"></div>

            <div class="dz-total-progress" id="total-progress" role="progressbar" aria-label="Overall upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-hidden="true">
                <div class="dz-total-progress__bar" id="total-progress-bar"></div>
            </div>

            <footer class="dz-footer">
                <div class="dz-footer__info">
                    <div class="dz-storage-ring" id="storage-ring" role="img" aria-label="Storage usage: 0 percent">
                        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dz-storage-ring__track"></circle>
                            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dz-storage-ring__fill" id="storage-ring-fill" stroke-dasharray="62.83" stroke-dashoffset="62.83" transform="rotate(-90 12 12)"></circle>
                        </svg>
                        <span class="dz-storage-ring__pct" id="storage-ring-pct">0%</span>
                    </div>
                    <span id="footer-status" aria-live="polite">No files selected</span>
                </div>
                <div class="dz-footer__actions">
                    <button type="button" class="dz-btn dz-btn--ghost" id="btn-clear" aria-label="Clear all files" disabled>
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg>
                        Clear
                    </button>
                    <button type="button" class="dz-btn dz-btn--primary" id="btn-upload" aria-label="Upload selected files" disabled>
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 9l5 -5l5 5"/><path d="M12 4l0 12"/></svg>
                        Upload
                    </button>
                </div>
            </footer>
        </div>
    </main>

    <script src="script.js"></script>

</body>

</html>
